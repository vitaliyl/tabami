<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabami - Database Studio</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #090a0f;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      user-select: none;
    }
    .card {
      text-align: center;
      max-width: 440px;
      padding: 2.5rem 2rem;
      background: #11141d;
      border: 1px solid #1e2433;
      border-radius: 1.25rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      background: rgba(225, 29, 72, 0.15);
      border: 1px solid rgba(225, 29, 72, 0.4);
      color: #fda4af;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 1.5rem;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #1e2433;
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 {
      color: #f8fafc;
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0 0 0.5rem;
    }
    p {
      font-size: 0.875rem;
      line-height: 1.6;
      color: #64748b;
      margin: 0 0 1.5rem;
    }
    .command-box {
      background: #090a0f;
      border: 1px solid #1e2433;
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8125rem;
      color: #34d399;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-badge">
      <span>💎</span>
      <span>TABAMI STUDIO</span>
    </div>
    <div class="spinner" id="spinner"></div>
    <h2 id="title">Connecting to Tabami Core...</h2>
    <p id="desc">Waiting for the local Hanami backend server to respond on port 2300.</p>
    <div class="command-box">
      <span>$</span>
      <span>bin/dev</span>
    </div>
  </div>

  <script>
    const TARGET_URL = "http://localhost:2300";
    let attempts = 0;

    async function probeServer() {
      try {
        const response = await fetch(TARGET_URL, {
          method: "GET",
          mode: "no-cors",
          cache: "no-cache"
        });
        window.location.replace(TARGET_URL);
      } catch (err) {
        attempts++;
        if (attempts > 3) {
          document.getElementById("desc").innerText = "Start the local backend server in your terminal to continue:";
        }
        setTimeout(probeServer, 600);
      }
    }

    probeServer();
  </script>
</body>
</html>
